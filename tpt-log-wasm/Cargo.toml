[package]
name = "tpt-log-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "WASM wrapper for tpt-microlog (wasm-bindgen): batching, fetch transport, sendBeacon fallback."
readme = "README.md"
homepage = "https://github.com/tpt-solutions/tpt-microlog/tree/master/tpt-log-wasm"
documentation = "https://docs.rs/tpt-log-wasm"
keywords = ["logging", "telemetry", "wasm", "browser", "datadog"]
categories = ["api-bindings", "development-tools::debugging", "wasm", "web-programming", "network-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

# Self-contained: the native core depends on threads, a disk WAL, and a
# blocking HTTP stack that do not exist in a browser (spec §9).
[dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf"] }

[dependencies.web-sys]
workspace = true
features = ["Window", "Headers", "Request", "RequestInit", "Response", "Navigator"]
