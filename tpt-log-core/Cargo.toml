[package]
name = "tpt-log-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core logging engine for tpt-microlog: lock-free queue, batching, compression, WAL, retry."
readme = "README.md"
homepage = "https://github.com/tpt-solutions/tpt-microlog/tree/master/tpt-log-core"
documentation = "https://docs.rs/tpt-log-core"
keywords = ["logging", "telemetry", "batching", "wal", "zstd"]
categories = ["development-tools::debugging", "asynchronous", "compression", "concurrency", "filesystem"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
zstd = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
hostname = { workspace = true }
regex = { workspace = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"], optional = true }
log = { version = "0.4", features = ["std"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
test-utils = []
# `tracing` Layer and `log` facade backend (see `integrations`).
tracing = ["dep:tracing", "dep:tracing-subscriber"]
log = ["dep:log"]