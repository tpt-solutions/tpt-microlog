[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
]
# Any license outside the `allow` list (including copyleft, unlicensed, and
# the SSPL/EUPL family) is rejected automatically.

[bans]
# Duplicate patch versions across the ecosystem (thiserror 1/2, syn 2/3,
# getrandom 0.2/0.4, windows-sys facets) are expected; surface as warnings.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"