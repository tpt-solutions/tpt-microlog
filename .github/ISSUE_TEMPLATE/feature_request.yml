name: Feature request
description: Suggest a backend, integration or capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved. Pull requests are not accepted, so
        the clearer the use case, the better the chance it is built.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Optional. A sketch of the API or config is welcome, but the problem matters more.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New backend / adapter
        - Language binding or framework integration
        - Reliability / delivery guarantees
        - Filtering, sampling or redaction
        - CLI
        - Documentation / examples
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
