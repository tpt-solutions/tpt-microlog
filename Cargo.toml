[workspace]
resolver = "2"
members = [
    "tpt-log-core",
    "tpt-log-transport",
    "tpt-log-ffi",
    "tpt-log-cli",
    "tpt-log-agent",
    "tpt-log-py",
    "tpt-log-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-microlog"
authors = ["TPT Solutions"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "2"
toml = "1.1"
base64 = "0.22"
rand = { version = "0.8", features = ["small_rng"] }
hostname = "0.4"
regex = "1"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost"] }
prost = "0.13"
hmac = "0.12"
sha2 = "0.11"

pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"