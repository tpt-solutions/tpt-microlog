[package]
name = "tpt-log-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Python wrapper for tpt-microlog (PyO3)."
readme = "README.md"
homepage = "https://github.com/tpt-solutions/tpt-microlog/tree/master/tpt-log-py"
documentation = "https://docs.rs/tpt-log-py"
keywords = ["logging", "telemetry", "python", "pyo3", "datadog"]
categories = ["api-bindings", "development-tools::debugging", "wasm", "development-tools"]

[lib]
name = "tpt_log_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-log-core = { path = "../tpt-log-core", version = "0.1.0" }
tpt-log-transport = { path = "../tpt-log-transport", version = "0.1.0" }
pyo3 = { workspace = true, optional = true }
serde_json = { workspace = true }

[features]
default = ["pyo3"]
pyo3 = ["dep:pyo3"]