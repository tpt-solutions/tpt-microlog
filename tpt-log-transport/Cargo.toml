[package]
name = "tpt-log-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Transport layer for tpt-microlog: HTTP/gRPC/UDP/TCP/file, backend adapters, retry + WAL integration."

[dependencies]
tpt-log-core = { path = "../tpt-log-core", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
zstd = { workspace = true }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
base64 = { workspace = true }

hmac = { workspace = true }
sha2 = { workspace = true }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
tpt-log-core = { path = "../tpt-log-core", version = "0.1.0", features = ["test-utils"] }