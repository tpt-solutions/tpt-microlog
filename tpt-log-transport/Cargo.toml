[package]
name = "tpt-log-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Transport layer for tpt-microlog: HTTP/gRPC/UDP/TCP/file, backend adapters, retry + WAL integration."
readme = "README.md"
homepage = "https://github.com/tpt-solutions/tpt-microlog/tree/master/tpt-log-transport"
documentation = "https://docs.rs/tpt-log-transport"
keywords = ["logging", "telemetry", "opentelemetry", "datadog", "transport"]
categories = ["network-programming", "development-tools::debugging", "asynchronous", "web-programming::http-client", "api-bindings"]

[dependencies]
tpt-log-core = { path = "../tpt-log-core", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
zstd = { workspace = true }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
base64 = { workspace = true }

hmac = { workspace = true }
sha2 = { workspace = true }

[build-dependencies]
tonic-build = "0.14"

[dev-dependencies]
tempfile = "3"
tpt-log-core = { path = "../tpt-log-core", version = "0.1.0", features = ["test-utils"] }