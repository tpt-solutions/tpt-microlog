syntax = "proto3";

package opentelemetry.proto.common.v1;

// AnyValue is the generic value type used throughout the OTLP messages.
message AnyValue {
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    int64 int_value = 3;
    double double_value = 4;
    ArrayValue array_value = 5;
    KeyValueList kvlist_value = 6;
    bytes bytes_value = 7;
  }
}

message ArrayValue {
  repeated AnyValue values = 1;
}

message KeyValueList {
  repeated KeyValue values = 1;
}

message KeyValue {
  string key = 1;
  AnyValue value = 2;
}

// InstrumentationScope is a name/version-scoped group of instrumentation.
message InstrumentationScope {
  string name = 1;
  string version = 2;
}