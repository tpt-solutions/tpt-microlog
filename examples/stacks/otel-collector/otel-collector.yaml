receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed   # prints every received log record to the collector's stdout

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug]
